name: Sync Upstream
on:
  schedule:
    - cron: '0 8 * * *' # UTC 8点 = 北京时间16点
  workflow_dispatch: # 支持手动点击运行
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_repository: huangxd-/danmu_api
          target_branch: main
          upstream_branch: main
          sync_tags: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

